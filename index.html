<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>JSON 编辑器</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">{ }</div>
        <div class="brand-copy">
          <h1>JSON 编辑器</h1>
          <p>递归解构与本地编辑，数据不会离开设备</p>
        </div>
        <span id="validity" class="validity" role="status" data-kind="neutral">等待输入</span>
      </header>

      <nav class="toolbar" aria-label="JSON 编辑工具">
        <div class="tool-group">
          <button class="tool-button primary" type="button" data-action="parse" aria-label="递归解析 JSON">
            <span class="tool-icon" aria-hidden="true">↻</span><span>递归解析</span>
          </button>
          <button class="tool-button" type="button" data-action="format" aria-label="格式化 JSON">
            <span class="tool-icon braces" aria-hidden="true">{ }</span><span>格式化</span>
          </button>
          <button class="tool-button" type="button" data-action="minify" aria-label="压缩 JSON">
            <span class="tool-icon" aria-hidden="true">≡</span><span>压缩</span>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-button" type="button" data-action="escape" aria-label="增加一层 JSON 转义">
            <span class="tool-icon" aria-hidden="true">“ ”</span><span>转义</span>
          </button>
          <button class="tool-button" type="button" data-action="unescape" aria-label="移除一层 JSON 转义">
            <span class="tool-icon" aria-hidden="true">‹ ›</span><span>去转义</span>
          </button>
        </div>

        <div class="tool-group">
          <button class="tool-button" type="button" data-action="fold-all" aria-label="折叠全部 JSON 节点">
            <span class="tool-icon" aria-hidden="true">⌃</span><span>全部折叠</span>
          </button>
          <button class="tool-button" type="button" data-action="unfold-all" aria-label="展开全部 JSON 节点">
            <span class="tool-icon" aria-hidden="true">⌄</span><span>全部展开</span>
          </button>
        </div>

        <div class="tool-group utility-tools">
          <button class="tool-button" type="button" data-action="search" aria-label="搜索 JSON 内容">
            <span class="tool-icon" aria-hidden="true">⌕</span><span>搜索</span>
          </button>
          <button class="tool-button" type="button" data-action="copy" aria-label="复制编辑器内容">
            <span class="tool-icon" aria-hidden="true">⧉</span><span>复制</span>
          </button>
          <button class="tool-button danger" type="button" data-action="clear" aria-label="清空编辑器">
            <span class="tool-icon" aria-hidden="true">×</span><span>清空</span>
          </button>
        </div>
      </nav>

      <div class="feedback-row">
        <p id="status" role="status" data-kind="neutral">粘贴完整 JSON 后将自动递归解析</p>
        <span class="shortcut-hint"><kbd>⌘/Ctrl</kbd> + <kbd>Enter</kbd> 解析</span>
      </div>

      <aside
        id="warning-panel"
        class="warning-panel"
        role="region"
        aria-live="polite"
        aria-label="解析警告"
        hidden
      >
        <strong>部分路径未能完全展开</strong>
        <ul id="warnings"></ul>
      </aside>

      <section class="editor-shell">
        <div id="editor" role="region" aria-label="JSON 编辑器"></div>
      </section>

      <footer class="status-bar" aria-label="编辑器状态">
        <span id="line-position">第 1 行，第 1 列</span>
        <span id="line-count">1 行</span>
        <span id="character-count">0 字符</span>
        <span id="byte-count">0 字节</span>
        <span class="status-spacer"></span>
        <span>空格：2</span>
        <span>UTF-8</span>
        <span>递归深度：100</span>
      </footer>
    </main>

    <script src="./dist/app.js"></script>
  </body>
</html>
